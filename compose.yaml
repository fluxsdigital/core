name: flux-core
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux-local
      POSTGRES_DB: flux_core
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - flux_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux_core"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  flux_pgdata:
