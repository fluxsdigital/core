name: flux-core-homolog

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: flux_core
    volumes:
      - postgres_homolog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux_core"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    image: flux-core-api:homolog
    pull_policy: never
    environment:
      DATABASE_URL: postgresql://flux:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/flux_core?schema=public
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: flux-core-api:homolog
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://flux:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/flux_core?schema=public
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost:8443}
      API_HOST: 0.0.0.0
      TRUST_PROXY_HOPS: "1"
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 12

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 12

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/nginx/homolog.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
        restart: true
      web:
        condition: service_healthy
        restart: true

volumes:
  postgres_homolog:
